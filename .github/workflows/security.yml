name: DevSecOps-Advanced-Pipeline

on:
  push:
    branches: [ "master", "main" ]

permissions:
  security-events: write
  contents: read
  
jobs:
  security-scans:
    name: Advanced Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
          format: 'sarif'
          output: 'gitleaks-results.sarif'
        continue-on-error: true
      
      - name: Run Trivy (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'bkimminich/juice-shop:latest'
          severity: 'HIGH,CRITICAL'
          # Просим плагин сделать чистый JSON-файл (без ломающихся шаблонов)
          format: 'json'
          output: 'trivy-report.json'
        continue-on-error: true       
     
      - name: Run Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep scan --config auto --sarif --output semgrep-results.sarif
        continue-on-error: true

      - name: Start Juice Shop application
        run: |
            docker run --rm -d -p 3000:3000 bkimminich/juice-shop:latest
            sleep 20
            
      - name: Run OWASP ZAP DAST Scan
        run: |
           docker run --name zap-scanner --network="host" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:3000 -x zap-report.xml
        continue-on-error: true

      - name: Extract XML Report from Docker
        run: |
          docker cp zap-scanner:/zap/zap-report.xml ./zap-report.xml
          sudo chmod 777 zap-report.xml
          docker rm zap-scanner
        if: always()
        
      - name: Archive All DefectDojo Reports
        uses: actions/upload-artifact@v4
        with:
          name: defectdojo-raw-reports
          path: |
            gitleaks-results.sarif
            trivy-report.json
            semgrep-results.sarif
            zap-report.xml
        if: always()
       
