name: DevSecOps-Advanced-Pipeline

on:
  push:
    branches: [ "master", "main" ]

jobs:
  security-scans:
    name: Advanced Security Suite
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Скачиваем код
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Шаг 2: Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Шаг 3: ИСПРАВЛЕНО. Скачиваем зависимости БЕЗ запуска скриптов сборки (ignore-scripts)
      - name: Install Dependencies Safely
        run: npm install --package-lock-only --legacy-peer-deps

      # Шаг 4: Поиск секретов (Gitleaks)
      - name: Run Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Шаг 5: ИСПРАВЛЕНО. Указываем Trivy сканировать проект напрямую
      - name: Run Trivy (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      # Шаг 6: Проверяем сам код на баги безопасности (Semgrep)
      - name: Run Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep scan --config auto
        continue-on-error: true
