name: DevSecOps-Advanced-Pipeline

on:
  push:
    branches: [ "master", "main" ]

permissions:
  security-events: write
  contents: read
  issues: write

jobs:
  security-scans:
    name: Advanced Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'bkimminich/juice-shop:latest'
          severity: 'HIGH,CRITICAL'
          format: 'template'
          template: "@$HOME/.local/bin/trivy-bin/contrib/html.tpl"
          output: 'trivy-report.html'
        continue-on-error: true
          
      - name: Upload Trivy HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-vulnerabilities-report
          path: trivy-report.html
        if: always()
      
      - name: Run Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep scan --config auto --sarif --output semgrep-results.sarif
        continue-on-error: true

      - name: Upload Semgrep Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        if: always()

      - name: Start Juice Shop application
        run: |
            docker run --rm -d -p 3000:3000 bkimminich/juice-shop:latest
            sleep 20
            
      - name: Run OWASP ZAP Baseline Scan
        run: |
           touch report.html
           chmod 777 report.html
           docker run --rm --network="host" -v ${{ github.workspace }}:/zap/wrk/:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:3000 -r report.html -I
        continue-on-error: true
        
      - name: Upload DAST HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-vulnerabilities-report
          path: report.html
       
