name: DevSecOps-Advanced-Pipeline

on:
  push:
    branches: [ "master", "main" ]

# Даем роботу права записывать результаты в раздел Security вашего репозитория
permissions:
  security-events: write
  contents: read

jobs:
  security-scans:
    name: Advanced Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      # ИСПРАВЛЕНО: Теперь Semgrep сохраняет результаты в файл и передает их в GitHub
      - name: Run Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep scan --config auto --sarif --output semgrep-results.sarif
        continue-on-error: true

      # Новый шаг: Загружаем файл с результатами в интерфейс GitHub
      - name: Upload Semgrep Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        if: always() # Этот шаг выполнится в любом случае
