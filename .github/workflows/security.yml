name: DevSecOps-Advanced-Pipeline

on:
  push:
    branches: [ "master", "main" ]

permissions:
  security-events: write
  contents: read
  issues: write

jobs:
  security-scans:
    name: Advanced Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Run Trivy (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'bkimminich/juice-shop:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true
      
      - name: Run Semgrep (SAST)
        run: |
          pip install semgrep
          semgrep scan --config auto --sarif --output semgrep-results.sarif
        continue-on-error: true

      - name: Upload Semgrep Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        if: always()

      - name: Start Juice Shop application
        run: |
            docker run --rm -d -p 3000:3000 bkimminich/juice-shop:latest
            sleep 20
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact_name: 'zap-dast-report'
       
